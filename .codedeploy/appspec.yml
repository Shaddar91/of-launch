version: 0.0
os: linux

files:
  - source: /docker-compose.yml
    destination: /opt/of-launch
  - source: /.image_tag
    destination: /opt/of-launch

permissions:
  - object: /opt/of-launch
    owner: ubuntu
    group: ubuntu

hooks:
  ApplicationStop:
    - location: scripts/application_stop.sh
      timeout: 120
      runas: root

  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 120
      runas: root

  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 300
      runas: root

  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 300
      runas: root

  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 120
      runas: root
